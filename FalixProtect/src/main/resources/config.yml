# =====================================================================
#  FalixProtect - Konfiguration        (Änderungen übernehmen: /protection reload)
# =====================================================================

settings:
  item-material: BEACON        # Block-Typ des Schutzblocks (z. B. BEACON, LODESTONE)
  radius-chunks: 1             # 1 = eigener Chunk + 8 Nachbarchunks (3x3 = 48x48 Blöcke)
  owner-bypass: false          # true = Besitzer darf im eigenen Schutzbereich abbauen
  protect-explosions: true     # true = TNT und Creeper zerstören keine geschützten Blöcke

item:
  name: "&6Schutzblock"
  lore:
    - "&7Platziere ihn, um einen Bereich"
    - "&7vor Abbau und Explosionen zu schützen."
    - "&8Radius: 1 Chunk"

messages:
  prefix: "&8[&9FalixProtect&8] &7"
  usage: "{prefix}&cBenutzung: &f{usage}"
  received: "{prefix}&aDu hast einen &fSchutzblock &aerhalten. Platziere ihn, um einen Bereich zu schützen."
  inventory-full: "{prefix}&eDein Inventar ist voll. Der Schutzblock liegt jetzt am Boden."
  placed: "{prefix}&aSchutzbereich aktiviert. Radius: &f{radius} Chunk&a."
  removed: "{prefix}&eSchutzbereich entfernt."
  blocked: "{prefix}&cDieser Bereich ist geschützt. Hier darfst du nichts zerstören."
  reload-done: "{prefix}&aKonfiguration neu geladen."
  list-header: "{prefix}&eSchutzblöcke &8(&f{count}&8)&e:"
  list-entry: "&8 - &7{world} &f{x} {y} {z} &8(&7{owner}&8)"
  list-none: "{prefix}&7Es gibt keine Schutzblöcke."
